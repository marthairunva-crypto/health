name: Build Android APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.1'
        channel: 'stable'
        cache: true
        
    - name: Accept Android licenses
      run: yes | flutter doctor --android-licenses || true
        
    - name: Flutter Doctor
      run: flutter doctor -v
        
    - name: Get Flutter dependencies
      run: flutter pub get
      
    - name: Check for build_runner
      run: |
        if grep -q "build_runner" pubspec.yaml; then
          echo "Running build_runner..."
          flutter pub run build_runner build --delete-conflicting-outputs || echo "Build runner failed, continuing anyway"
        else
          echo "No build_runner found, skipping..."
        fi
      
    - name: Clean build
      run: flutter clean
      
    - name: Build APK
      run: flutter build apk --release --verbose
      
    - name: Show errors on failure
      if: failure()
      run: |
        echo "=== Build failed - searching for error ==="
        grep -n -B2 -A15 -E "What went wrong|FAILURE:|^e: |error:|Execution failed" build.log 2>/dev/null | head -100 || echo "No build.log captured"
      
    - name: List build outputs
      if: always()
      run: |
        echo "=== Checking for APK files ==="
        ls -lh build/app/outputs/flutter-apk/*.apk 2>/dev/null || echo "No APK in flutter-apk/"
        ls -lh build/app/outputs/apk/release/*.apk 2>/dev/null || echo "No APK in apk/release/"
        find build -name "*.apk" -type f -exec ls -lh {} \; 2>/dev/null || echo "No APK files found anywhere"
      
    - name: Upload APK artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: health-ai-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
        if-no-files-found: error
        
    - name: Create Release (on tag push)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: build/app/outputs/flutter-apk/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
