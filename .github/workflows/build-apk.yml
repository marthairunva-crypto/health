name: Build Android APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.1'
        channel: 'stable'
        cache: true
        
    - name: Accept Android licenses
      run: yes | flutter doctor --android-licenses || true
        
    - name: Flutter Doctor
      run: flutter doctor -v
        
    - name: Get Flutter dependencies
      run: flutter pub get
      
    - name: Show dart/flutter versions
      run: |
        echo "=== Dart version ==="
        dart --version
        echo ""
        echo "=== Flutter version ==="
        flutter --version
        echo ""
        echo "=== Checking for code generation dependencies ==="
        grep -A2 "dev_dependencies:" pubspec.yaml | head -20
      
    - name: Run build_runner
      continue-on-error: true
      id: build_runner_step
      run: |
        touch build_runner.log
        if grep -q "build_runner" pubspec.yaml; then
          echo "Running build_runner..."
          dart run build_runner build --delete-conflicting-outputs 2>&1 | tee build_runner.log
          BUILD_RUNNER_EXIT=${PIPESTATUS[0]}
          echo "Build runner exit code: $BUILD_RUNNER_EXIT"
          if [ $BUILD_RUNNER_EXIT -ne 0 ]; then
            echo "=== Build runner failed with errors ==="
            cat build_runner.log || true
          fi
          exit $BUILD_RUNNER_EXIT
        else
          echo "No build_runner found, skipping..."
        fi
      
    - name: Upload build_runner log on failure
      if: steps.build_runner_step.outcome == 'failure'
      uses: actions/upload-artifact@v4.6.0
      with:
        name: build-runner-log
        path: build_runner.log
        retention-days: 7
        if-no-files-found: warn
      
    - name: Verify generated files
      run: |
        echo "=== Checking for generated files ==="
        find lib -name "*.g.dart" -o -name "*.freezed.dart" 2>/dev/null | head -20 || echo "No generated files found"
        GENERATED_COUNT=$(find lib -name "*.g.dart" -o -name "*.freezed.dart" 2>/dev/null | wc -l)
        echo "Found $GENERATED_COUNT generated files"
        if [ $GENERATED_COUNT -eq 0 ] && grep -q "build_runner" pubspec.yaml; then
          echo "WARNING: build_runner is in pubspec but no generated files found!"
          echo "This may cause build failures."
          if [ "${{ steps.build_runner_step.outcome }}" == "failure" ]; then
            echo "ERROR: Build runner failed AND no generated files exist."
            echo "The APK build will likely fail. Check build_runner.log artifact."
          fi
        fi
      
    - name: Clean build
      run: flutter clean
      
    - name: Build APK
      shell: bash
      run: |
        set -x
        # Ensure build.log is created even if build fails immediately
        touch build.log
        flutter build apk --release 2>&1 | tee build.log
        BUILD_EXIT=${PIPESTATUS[0]}
        echo "Build exit code: $BUILD_EXIT"
        exit $BUILD_EXIT
      
    - name: Show errors on failure
      if: failure()
      run: |
        if [ -f build.log ]; then
          echo "=== Searching for 'What went wrong' ==="
          grep -n -B5 -A20 "What went wrong" build.log || echo "Pattern not found"
          echo ""
          echo "=== Searching for 'FAILURE' ==="
          grep -n -B5 -A20 "FAILURE:" build.log || echo "Pattern not found"
          echo ""
          echo "=== Searching for 'Execution failed' ==="
          grep -n -B3 -A15 "Execution failed" build.log || echo "Pattern not found"
          echo ""
          echo "=== Last 100 lines of build log ==="
          tail -n 100 build.log
        else
          echo "build.log not found - build may have failed before log creation"
        fi
        
    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4.6.0
      with:
        name: build-log
        path: |
          build.log
          build_runner.log
        retention-days: 7
        if-no-files-found: warn
      
    - name: List build outputs
      if: always()
      run: |
        echo "=== Checking for APK files ==="
        ls -lh build/app/outputs/flutter-apk/*.apk 2>/dev/null || echo "No APK in flutter-apk/"
        ls -lh build/app/outputs/apk/release/*.apk 2>/dev/null || echo "No APK in apk/release/"
        find build -name "*.apk" -type f -exec ls -lh {} \; 2>/dev/null || echo "No APK files found anywhere"
      
    - name: Upload APK artifact
      if: success()
      uses: actions/upload-artifact@v4.6.0
      with:
        name: health-ai-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
        if-no-files-found: error
        
    - name: Create Release (on tag push)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: build/app/outputs/flutter-apk/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
