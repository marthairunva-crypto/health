name: Build Android APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.1'
        channel: 'stable'
        cache: true
        
    - name: Flutter Doctor
      run: flutter doctor -v
        
    - name: Get Flutter dependencies
      run: flutter pub get
      
    - name: Check for build_runner
      run: |
        if grep -q "build_runner" pubspec.yaml; then
          echo "Running build_runner..."
          flutter pub run build_runner build --delete-conflicting-outputs || echo "Build runner failed, continuing anyway"
        else
          echo "No build_runner found, skipping..."
        fi
      
    - name: Clean build
      run: flutter clean
      
    - name: Build APK
      run: |
        flutter build apk --release --verbose 2>&1 | tee build.log
        exit ${PIPESTATUS[0]}
      continue-on-error: true
      
    - name: Show last 200 lines of build log on failure
      if: failure()
      run: tail -n 200 build.log || echo "No build log found"
      
    - name: List build outputs
      if: always()
      run: |
        echo "Build directory contents:"
        ls -la build/app/outputs/flutter-apk/ || echo "Build output directory not found"
      
    - name: Upload APK artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: health-ai-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
        
    - name: Create Release (on tag push)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: build/app/outputs/flutter-apk/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
