name: Build Android APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.1'
        channel: 'stable'
        cache: true
        
    - name: Accept Android licenses
      run: yes | flutter doctor --android-licenses || true
        
    - name: Flutter Doctor
      run: flutter doctor -v
        
    - name: Get Flutter dependencies
      run: flutter pub get
      
    - name: Check for build_runner
      run: |
        if grep -q "build_runner" pubspec.yaml; then
          echo "Running build_runner..."
          dart run build_runner build --delete-conflicting-outputs
        else
          echo "No build_runner found, skipping..."
        fi
      
    - name: Clean build
      run: flutter clean
      
    - name: Build APK
      shell: bash
      run: flutter build apk --release 2>&1 | tee build.log
      
    - name: Show errors on failure
      if: failure()
      run: |
        echo "=== Searching for 'What went wrong' ==="
        grep -n -B5 -A20 "What went wrong" build.log || echo "Pattern not found"
        echo ""
        echo "=== Searching for 'FAILURE' ==="
        grep -n -B5 -A20 "FAILURE:" build.log || echo "Pattern not found"
        echo ""
        echo "=== Searching for 'Execution failed' ==="
        grep -n -B3 -A15 "Execution failed" build.log || echo "Pattern not found"
        echo ""
        echo "=== Last 100 lines of build log ==="
        tail -n 100 build.log
        
    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
      
    - name: List build outputs
      if: always()
      run: |
        echo "=== Checking for APK files ==="
        ls -lh build/app/outputs/flutter-apk/*.apk 2>/dev/null || echo "No APK in flutter-apk/"
        ls -lh build/app/outputs/apk/release/*.apk 2>/dev/null || echo "No APK in apk/release/"
        find build -name "*.apk" -type f -exec ls -lh {} \; 2>/dev/null || echo "No APK files found anywhere"
      
    - name: Upload APK artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: health-ai-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
        if-no-files-found: error
        
    - name: Create Release (on tag push)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: build/app/outputs/flutter-apk/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
