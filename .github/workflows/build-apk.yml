name: Build Android APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.1'
        channel: 'stable'
        cache: true
        
    - name: Accept Android licenses
      run: yes | flutter doctor --android-licenses || true
        
    - name: Flutter Doctor
      run: flutter doctor -v
        
    - name: Get Flutter dependencies
      run: flutter pub get
      
    - name: Check for build_runner
      run: |
        if grep -q "build_runner" pubspec.yaml; then
          echo "Running build_runner..."
          flutter pub run build_runner build --delete-conflicting-outputs || echo "Build runner failed, continuing anyway"
        else
          echo "No build_runner found, skipping..."
        fi
      
    - name: Clean build
      run: flutter clean
      
    - name: Build APK
      run: flutter build apk --release --verbose 2>&1 | tee build.log
      continue-on-error: true
      
    - name: Show errors
      if: always()
      run: |
        echo "=== Searching for errors in build log ==="
        grep -n -B2 -A15 -E "What went wrong|FAILURE:|^e: |error:|Execution failed" build.log | head -100 || echo "No specific error pattern found"
        echo ""
        echo "=== Last 50 lines of build log ==="
        tail -n 50 build.log
      
    - name: List build outputs
      if: always()
      run: |
        echo "=== Finding all APK files ==="
        find build -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
        
    - name: Find and upload APK
      if: success()
      run: |
        APK_PATH=$(find build -name "app-release.apk" -type f | head -1)
        if [ -n "$APK_PATH" ]; then
          echo "Found APK at: $APK_PATH"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
        else
          echo "No app-release.apk found"
          exit 1
        fi
      
    - name: Upload APK artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: health-ai-apk
        path: ${{ env.APK_PATH }}
        retention-days: 30
        
    - name: Create Release (on tag push)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: build/app/outputs/flutter-apk/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
